<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챌린지 실시간 최고 기록 전광판</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-tap: #38bdf8;
      --accent-stick: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .board-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1200px;
    }

    @media (max-width: 768px) {
      .board-container {
        grid-template-columns: 1fr;
      }
    }

    .challenge-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .tap-theme .card-title { color: var(--accent-tap); }
    .stick-theme .card-title { color: var(--accent-stick); }

    /* 최고 기록 강조 영역 */
    .best-record-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid transparent;
      transition: transform 0.2s ease;
    }

    .tap-theme .best-record-box { border-color: rgba(56, 189, 248, 0.4); }
    .stick-theme .best-record-box { border-color: rgba(251, 191, 36, 0.4); }

    .crown-badge {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .tap-theme .crown-badge { background: rgba(56, 189, 248, 0.2); color: var(--accent-tap); }
    .stick-theme .crown-badge { background: rgba(251, 191, 36, 0.2); color: var(--accent-stick); }

    .best-score {
      font-size: 3.5rem;
      font-weight: 900;
      margin: 8px 0;
      line-height: 1.1;
    }

    .best-holder {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* 입력 폼 */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #94a3b8;
    }

    .input-name { flex: 1.2; }
    .input-score { flex: 1; }

    button.add-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      transition: opacity 0.2s;
    }

    button.add-btn:hover { opacity: 0.9; }
    .tap-theme button.add-btn { background-color: var(--accent-tap); }
    .stick-theme button.add-btn { background-color: var(--accent-stick); }

    /* 순위표 리스트 */
    .rank-list {
      list-style: none;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #334155;
      font-size: 1.1rem;
    }

    .rank-item:last-child { border-bottom: none; }
    .rank-num { font-weight: 700; margin-right: 10px; color: var(--text-sub); }
    .rank-score { font-weight: 700; }

    .reset-area {
      margin-top: 30px;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .reset-btn:hover {
      background: #334155;
      color: white;
    }

    /* 신기록 애니메이션 */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .new-record-anim {
      animation: pop 0.4s ease;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏆 챌린지 실시간 최고 기록 전광판</h1>
  </header>

  <div class="board-container">
    <!-- 1. 모션탭 반응속도 챌린지 (낮을수록 1위) -->
    <div class="challenge-card tap-theme">
      <div>
        <div class="card-header">
          <span class="card-title">⚡ 모션탭 반응속도</span>
          <span style="color: var(--text-sub); font-size: 0.9rem;">단위: 초 (낮을수록 1위)</span>
        </div>

        <div class="best-record-box" id="tap-best-box">
          <div class="crown-badge">👑 현재 최고 기록</div>
          <div class="best-score" id="tap-best-score">-</div>
          <div class="best-holder" id="tap-best-holder">도전자를 기다립니다</div>
        </div>

        <div class="input-group">
          <input type="text" id="tap-name" class="input-name" placeholder="학번 이름 (예: 10101 홍길동)">
          <input type="number" step="0.001" id="tap-score" class="input-score" placeholder="기록 (예: 0.245)">
          <button class="add-btn" onclick="addRecord('tap')">등록</button>
        </div>
      </div>

      <ul class="rank-list" id="tap-list"></ul>
    </div>

    <!-- 2. 떨어지는 스틱 잡기 챌린지 (높을수록 1위) -->
    <div class="challenge-card stick-theme">
      <div>
        <div class="card-header">
          <span class="card-title">🥢 떨어지는 스틱 잡기</span>
          <span style="color: var(--text-sub); font-size: 0.9rem;">단위: 개 (많을수록 1위)</span>
        </div>

        <div class="best-record-box" id="stick-best-box">
          <div class="crown-badge">👑 현재 최고 기록</div>
          <div class="best-score" id="stick-best-score">-</div>
          <div class="best-holder" id="stick-best-holder">도전자를 기다립니다</div>
        </div>

        <div class="input-group">
          <input type="text" id="stick-name" class="input-name" placeholder="학번 이름 (예: 10205 김철수)">
          <input type="number" step="1" id="stick-score" class="input-score" placeholder="개수 (예: 8)">
          <button class="add-btn" onclick="addRecord('stick')">등록</button>
        </div>
      </div>

      <ul class="rank-list" id="stick-list"></ul>
    </div>
  </div>

  <div class="reset-area">
    <button class="reset-btn" onclick="resetAll()">전체 기록 초기화</button>
  </div>

  <script>
    // 로컬 스토리지에서 데이터 불러오기
    let records = JSON.parse(localStorage.getItem('boothChallengeRecords')) || {
      tap: [],
      stick: []
    };

    function saveRecords() {
      localStorage.setItem('boothChallengeRecords', JSON.stringify(records));
    }

    function addRecord(type) {
      const nameInput = document.getElementById(`${type}-name`);
      const scoreInput = document.getElementById(`${type}-score`);
      
      const name = nameInput.value.trim();
      const score = parseFloat(scoreInput.value);

      if (!name || isNaN(score)) {
        alert('이름과 기록을 정확히 입력해주세요.');
        return;
      }

      // 기존 최고 기록 확인 (신기록 효과용)
      const prevBest = records[type].length > 0 ? records[type][0].score : null;

      records[type].push({ name, score });

      // 정렬: 모션탭(tap)은 오름차순(작을수록 1위), 스틱(stick)은 내림차순(클수록 1위)
      if (type === 'tap') {
        records[type].sort((a, b) => a.score - b.score);
      } else {
        records[type].sort((a, b) => b.score - a.score);
      }

      saveRecords();
      renderBoard(type);

      // 신기록 달성 시 애니메이션 효과
      const newBest = records[type][0].score;
      if (prevBest === null || (type === 'tap' && newBest < prevBest) || (type === 'stick' && newBest > prevBest)) {
        const bestBox = document.getElementById(`${type}-best-box`);
        bestBox.classList.remove('new-record-anim');
        void bestBox.offsetWidth; // 리플로우 트리거
        bestBox.classList.add('new-record-anim');
      }

      // 입력창 초기화
      nameInput.value = '';
      scoreInput.value = '';
      nameInput.focus();
    }

    function renderBoard(type) {
      const list = records[type];
      const bestScoreEl = document.getElementById(`${type}-best-score`);
      const bestHolderEl = document.getElementById(`${type}-best-holder`);
      const listEl = document.getElementById(`${type}-list`);
      const unit = type === 'tap' ? '초' : '개';

      if (list.length === 0) {
        bestScoreEl.textContent = '-';
        bestHolderEl.textContent = '도전자를 기다립니다';
        listEl.innerHTML = '';
        return;
      }

      // 1위 표시
      bestScoreEl.textContent = `${list[0].score}${unit}`;
      bestHolderEl.textContent = list[0].name;

      // 상위 5위까지 순위표 표시
      listEl.innerHTML = list.slice(0, 5).map((item, idx) => `
        <li class="rank-item">
          <span><span class="rank-num">${idx + 1}위</span>${item.name}</span>
          <span class="rank-score">${item.score}${unit}</span>
        </li>
      `).join('');
    }

    function resetAll() {
      if (confirm('모든 기록을 초기화하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.')) {
        records = { tap: [], stick: [] };
        saveRecords();
        renderBoard('tap');
        renderBoard('stick');
      }
    }

    // 엔터키 입력 지원
    ['tap', 'stick'].forEach(type => {
      document.getElementById(`${type}-score`).addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addRecord(type);
      });
    });

    // 초기 렌더링
    renderBoard('tap');
    renderBoard('stick');
  </script>
</body>
</html>
