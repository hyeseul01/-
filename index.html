<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모션탭 반응속도 챌린지 전광판</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-tap: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent-tap);
    }

    .board-container {
      width: 100%;
      max-width: 720px;
    }

    .challenge-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #334155;
      padding-bottom: 14px;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* 최고 기록 강조 영역 */
    .best-record-box {
      background: rgba(15, 23, 42, 0.65);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 24px;
      border: 2px solid rgba(56, 189, 248, 0.45);
      transition: transform 0.2s ease;
    }

    .crown-badge {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-tap);
    }

    .best-score {
      font-size: 4.5rem;
      font-weight: 900;
      margin: 8px 0;
      line-height: 1.1;
    }

    .best-holder {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* 입력 폼 */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-tap);
    }

    .input-name { flex: 1.3; }
    .input-score { flex: 1; }

    button.add-btn {
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      background-color: var(--accent-tap);
      transition: opacity 0.2s;
    }

    button.add-btn:hover { opacity: 0.9; }

    /* 순위표 리스트 */
    .rank-list {
      list-style: none;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      font-size: 1.2rem;
    }

    .rank-item:last-child { border-bottom: none; }
    .rank-num { font-weight: 700; margin-right: 12px; color: var(--text-sub); }
    .rank-score { font-weight: 700; color: var(--accent-tap); }

    .reset-area {
      margin-top: 28px;
      text-align: center;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .reset-btn:hover {
      background: #334155;
      color: white;
    }

    /* 신기록 애니메이션 */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .new-record-anim {
      animation: pop 0.4s ease;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 모션탭 반응속도 챌린지</h1>
  </header>

  <div class="board-container">
    <div class="challenge-card">
      <div class="card-header">
        <span class="card-title">실시간 최고 기록 전광판</span>
        <span style="color: var(--text-sub); font-size: 0.95rem;">단위: 초 (낮을수록 1위)</span>
      </div>

      <div class="best-record-box" id="tap-best-box">
        <div class="crown-badge">👑 현재 최고 기록</div>
        <div class="best-score" id="tap-best-score">-</div>
        <div class="best-holder" id="tap-best-holder">도전자를 기다립니다</div>
      </div>

      <div class="input-group">
        <input type="text" id="tap-name" class="input-name" placeholder="학번 이름 (예: 10101 홍길동)">
        <input type="number" step="0.001" id="tap-score" class="input-score" placeholder="기록 (예: 0.245)">
        <button class="add-btn" onclick="addRecord()">등록</button>
      </div>

      <ul class="rank-list" id="tap-list"></ul>
    </div>

    <div class="reset-area">
      <button class="reset-btn" onclick="resetAll()">전체 기록 초기화</button>
    </div>
  </div>

  <script>
    // 로컬 스토리지에서 데이터 불러오기 (단독 버전 전용 키 사용)
    let records = JSON.parse(localStorage.getItem('motionTapOnlyRecords')) || [];

    function saveRecords() {
      localStorage.setItem('motionTapOnlyRecords', JSON.stringify(records));
    }

    function addRecord() {
      const nameInput = document.getElementById('tap-name');
      const scoreInput = document.getElementById('tap-score');
      
      const name = nameInput.value.trim();
      const score = parseFloat(scoreInput.value);

      if (!name || isNaN(score)) {
        alert('이름과 기록을 정확히 입력해주세요.');
        return;
      }

      const prevBest = records.length > 0 ? records[0].score : null;

      records.push({ name, score });

      // 오름차순 정렬 (낮을수록 1위)
      records.sort((a, b) => a.score - b.score);

      saveRecords();
      renderBoard();

      // 신기록 달성 시 애니메이션 효과
      const newBest = records[0].score;
      if (prevBest === null || newBest < prevBest) {
        const bestBox = document.getElementById('tap-best-box');
        bestBox.classList.remove('new-record-anim');
        void bestBox.offsetWidth;
        bestBox.classList.add('new-record-anim');
      }

      nameInput.value = '';
      scoreInput.value = '';
      nameInput.focus();
    }

    function renderBoard() {
      const bestScoreEl = document.getElementById('tap-best-score');
      const bestHolderEl = document.getElementById('tap-best-holder');
      const listEl = document.getElementById('tap-list');

      if (records.length === 0) {
        bestScoreEl.textContent = '-';
        bestHolderEl.textContent = '도전자를 기다립니다';
        listEl.innerHTML = '';
        return;
      }

      // 1위 표시
      bestScoreEl.textContent = `${records[0].score}초`;
      bestHolderEl.textContent = records[0].name;

      // 상위 5위까지 순위표 표시
      listEl.innerHTML = records.slice(0, 5).map((item, idx) => `
        <li class="rank-item">
          <span><span class="rank-num">${idx + 1}위</span>${item.name}</span>
          <span class="rank-score">${item.score}초</span>
        </li>
      `).join('');
    }

    function resetAll() {
      if (confirm('모든 기록을 초기화하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.')) {
        records = [];
        saveRecords();
        renderBoard();
      }
    }

    // 엔터키 입력 지원
    document.getElementById('tap-score').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addRecord();
    });

    // 초기 렌더링
    renderBoard();
  </script>
</body>
</html>
